
services:
#DB and cache layer
  cache:
    image: redis:alpine
    container_name: planted-redis
    ports:
      - "6379:6379"
    networks:
      - flora-network

#backend for frontend layer
  bff:
    build:
      context: .
      dockerfile: bff/Dockerfile
    command: npm run dev
    container_name: planted-bff
    ports:
      - "3001:3001"
    env_file:
      - ./bff/.env.development
    depends_on:
      - cache
    networks:
      - flora-network
    volumes:
      - ./bff/src:/app/bff/src
      - ./packages:/app/packages

#forntend layer
  frontend:
    build: ./frontend
    container_name: planted-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env.development
    depends_on:
      - bff
    stdin_open: true
    networks:
      - flora-network
    volumes:
      - ./frontend/src:/app/src

networks:
  flora-network:
    driver: bridge